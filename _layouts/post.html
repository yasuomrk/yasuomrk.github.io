---
layout: default
---

<nav class="breadcrumb">
  ← <a href="{{ '/' | relative_url }}">home</a>
  / <a href="{{ '/categories/' | append: page.category | relative_url }}">{{ page.category }}</a>
  / <span class="crumb-current">{{ page.title | truncatewords: 5 }}</span>
</nav>

<article>
  <header class="post-header">
    <h1 class="post-title-main">{{ page.title }}</h1>
    <div class="post-meta">
      <span class="meta-cat">{{ page.category }}</span>
      {{ page.date | date: "%Y-%m-%d" }}
    </div>
  </header>

  <div class="post-body">
    {{ content }}
  </div>
</article>
