<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="/favicon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <div class="site-wrap">

    <header class="site-header">
      <h1 class="site-title">
        <a href="{{ '/' | relative_url }}"><span class="tilde">~/</span>{{ site.title }}</a>
      </h1>
      <p class="site-tagline">{{ site.description }}</p>
      <nav class="site-nav">
        <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}class="active"{% endif %}>home</a>
        <a href="{{ '/about' | relative_url }}" {% if page.url contains 'about' %}class="active"{% endif %}>about</a>
      </nav>
    </header>

    <main>
      {{ content }}
    </main>

    <footer class="site-footer">
      <span>powered by jekyll</span>
      <span>{{ site.title }} &copy; {{ 'now' | date: '%Y' }}</span>
    </footer>

  </div>
</body>
</html>
